<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>지뢰찾기</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-labelledby="gameTitle">
      <section class="topbar">
        <div>
          <p class="eyebrow">classic puzzle</p>
          <h1 id="gameTitle">지뢰찾기</h1>
        </div>

        <div class="controls" aria-label="게임 설정">
          <label class="field">
            <span>난이도</span>
            <select id="difficulty">
              <option value="beginner">초급 9 x 9</option>
              <option value="intermediate">중급 16 x 16</option>
              <option value="expert">고급 30 x 16</option>
            </select>
          </label>

          <button id="newGame" class="button primary" type="button">새 게임</button>
          <button id="flagMode" class="button" type="button" aria-pressed="false">깃발 모드</button>
          <button
            id="lifeMode"
            class="button"
            type="button"
            aria-pressed="false"
          >
            라이프
          </button>
          <button
            id="autoOpen"
            class="button"
            type="button"
            aria-pressed="false"
          >
            자동 개방
          </button>
          <button
            id="assistantToggle"
            class="button"
            type="button"
            aria-pressed="false"
            aria-controls="assistantPanel"
          >
            어시스턴트
          </button>
        </div>
      </section>

      <section class="status-grid" aria-live="polite">
        <div class="status-card">
          <span>남은 지뢰</span>
          <strong id="mineCount">10</strong>
        </div>
        <div id="lifeStatus" class="status-card" hidden>
          <span>라이프</span>
          <strong id="lifeCount">3 / 3</strong>
        </div>
        <div class="status-card">
          <span>시간</span>
          <strong id="timer">000</strong>
        </div>
        <div class="status-card wide">
          <span>상태</span>
          <strong id="message">첫 칸을 열어 시작하세요</strong>
        </div>
      </section>

      <div class="play-layout">
        <section class="game-area" aria-label="지뢰찾기 보드">
          <div class="board-wrap">
            <div id="board" class="board" role="grid" aria-label="지뢰찾기 칸"></div>
          </div>
        </section>

        <section
          id="assistantPanel"
          class="assistant-panel"
          data-status="idle"
          aria-live="polite"
          hidden
        >
          <div class="assistant-verdict">
            <span>어시스턴트 판단</span>
            <strong id="assistantVerdict">분석 준비</strong>
          </div>
          <div class="assistant-summary">
            <div
              class="assistant-depth"
              role="group"
              aria-label="설명 깊이"
            >
              <button
                id="assistantSimple"
                type="button"
                aria-pressed="true"
              >
                간단히
              </button>
              <button
                id="assistantDetailed"
                type="button"
                aria-pressed="false"
              >
                자세히
              </button>
            </div>
            <p id="assistantReason">닫힌 칸에 마우스를 올리면 판단 근거를 알려드립니다.</p>
          </div>
          <div id="assistantDetails" class="assistant-details" hidden>
            <div class="assistant-metric">
              <span id="assistantTechnique">사용 기법</span>
              <strong id="assistantFormula">계산 준비</strong>
            </div>
            <section
              id="assistantVisual"
              class="assistant-visual"
              aria-labelledby="assistantVisualTitle"
              hidden
            >
              <div class="assistant-visual-heading">
                <strong id="assistantVisualTitle">추론 미니맵</strong>
                <span id="assistantVisualCaption">공개 정보 기반</span>
              </div>
              <div id="assistantMiniMaps" class="assistant-mini-maps"></div>
              <div class="assistant-mini-legend" aria-label="미니맵 범례">
                <span><i class="legend-mine"></i>논리적 지뢰</span>
                <span><i class="legend-safe"></i>논리적 안전</span>
                <span><i class="legend-unknown"></i>판단 불가</span>
              </div>
            </section>
            <ol id="assistantSteps" class="assistant-steps"></ol>
            <p id="assistantPrinciple" class="assistant-principle"></p>
          </div>
        </section>
      </div>

      <section class="help">
        <p>왼쪽 클릭으로 열고, 오른쪽 클릭이나 깃발 모드로 표시합니다. 어시스턴트를 켜면 닫힌 칸에 마우스를 올리거나 키보드로 초점을 옮겨 논리적 판단 근거를 볼 수 있습니다.</p>
      </section>
    </main>

    <script src="./assistant.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
