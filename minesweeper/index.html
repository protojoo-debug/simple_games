<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>지뢰찾기</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-labelledby="gameTitle">
      <section class="topbar">
        <div>
          <p class="eyebrow">classic puzzle</p>
          <h1 id="gameTitle">지뢰찾기</h1>
        </div>

        <div class="controls" aria-label="게임 설정">
          <label class="field">
            <span>난이도</span>
            <select id="difficulty">
              <option value="beginner">초급 9 x 9</option>
              <option value="intermediate">중급 16 x 16</option>
              <option value="expert">고급 30 x 16</option>
            </select>
          </label>

          <button id="newGame" class="button primary" type="button">새 게임</button>
          <button id="flagMode" class="button" type="button" aria-pressed="false">깃발 모드</button>
        </div>
      </section>

      <section class="status-grid" aria-live="polite">
        <div class="status-card">
          <span>남은 지뢰</span>
          <strong id="mineCount">10</strong>
        </div>
        <div class="status-card">
          <span>시간</span>
          <strong id="timer">000</strong>
        </div>
        <div class="status-card wide">
          <span>상태</span>
          <strong id="message">첫 칸을 열어 시작하세요</strong>
        </div>
      </section>

      <section class="game-area" aria-label="지뢰찾기 보드">
        <div class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="지뢰찾기 칸"></div>
        </div>
      </section>

      <section class="help">
        <p>왼쪽 클릭으로 열고, 오른쪽 클릭이나 깃발 모드로 표시합니다. 키보드에서는 Enter 또는 Space로 열고 F로 깃발을 놓을 수 있습니다.</p>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
