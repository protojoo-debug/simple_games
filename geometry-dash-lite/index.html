<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dash Runner</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Dash Runner game">
      <canvas id="game" width="1280" height="720" aria-label="Dash Runner play field"></canvas>

      <section class="hud" aria-live="polite">
        <div class="stat">
          <span class="stat-label">SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div class="stage-progress">
          <span id="stageName" class="stage-name">STAGE 1 · NEON START</span>
          <div class="progress" aria-label="Level progress">
            <span id="progressFill"></span>
          </div>
        </div>
        <div class="stat right">
          <span class="stat-label">BEST</span>
          <strong id="best">0</strong>
        </div>
      </section>

      <section id="menu" class="overlay visible">
        <div class="panel">
          <p class="eyebrow">rhythm platformer</p>
          <h1>Dash Runner</h1>
          <p class="tagline">박자에 맞춰 달리고, 누르고 있으면 연속 점프.</p>
          <div class="stage-select" role="group" aria-label="스테이지 선택">
            <button class="stage-button selected" type="button" data-stage="0" aria-pressed="true">
              <strong>01</strong>
              <span>Neon Start<small>120 BPM</small></span>
            </button>
            <button class="stage-button" type="button" data-stage="1" aria-pressed="false">
              <strong>02</strong>
              <span>Pulse Circuit<small>132 BPM</small></span>
            </button>
            <button class="stage-button" type="button" data-stage="2" aria-pressed="false">
              <strong>03</strong>
              <span>Hyper Drive<small>144 BPM</small></span>
            </button>
            <button class="stage-button" type="button" data-stage="3" aria-pressed="false">
              <strong>04</strong>
              <span>Skyline Steps<small>132 BPM · AIR</small></span>
            </button>
            <button class="stage-button" type="button" data-stage="4" aria-pressed="false">
              <strong>05</strong>
              <span>One Hold Core<small>134 BPM · ONE HOLD</small></span>
            </button>
          </div>
          <button id="startButton" class="primary-button" type="button">시작</button>
        </div>
      </section>

      <section id="result" class="overlay">
        <div class="panel compact">
          <p id="resultKicker" class="eyebrow">crashed</p>
          <h2 id="resultTitle">다시 달려볼까요?</h2>
          <p id="resultScore" class="tagline">score 0</p>
          <button id="restartButton" class="primary-button" type="button">재시작</button>
        </div>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
